name: build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8 is the language level the library targets, so it has to keep running
        # there. 17 and 21 catch anything that only breaks on a modern JDK, which
        # is how the TLS tests found that Netty can no longer generate a
        # certificate without BouncyCastle.
        java: ['8', '17', '21']

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build, test and check coverage
        run: mvn -B --no-transfer-progress verify

      - name: Confirm the jar targets Java 8
        if: matrix.java == '21'
        run: |
          # Major version 52 is Java 8. Guards against the release setting being
          # lost, which would silently publish a jar most consumers cannot load.
          class=target/classes/io/github/aindriub/irc/client/Client.class
          major=$(javap -v -cp target/classes io.github.aindriub.irc.client.Client \
            | awk '/major version/ {print $3}')
          echo "major version: $major"
          test "$major" = "52" 

      - name: Publish the coverage report
        if: always() && matrix.java == '21'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn
