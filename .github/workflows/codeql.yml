name: codeql

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, so a newly published advisory is found without waiting for a push.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: Build
        run: mvn -B --no-transfer-progress -DskipTests package

      - uses: github/codeql-action/analyze@v4
